defaults:
    - _self_
    - task: ft
    - local_env: default

# Experiment args
mode: 'ft'
device: gpu
precision: 'bf16'
eval_only: false
predict_only: false
seed: 2137
tokenizer: 
    name: 'bratao/portugueseT5'

model:
    klass: hf_t5
    name: 'bratao/portugueseT5'
    overwrite: # overwrite config with these values
        dropout_rate: 0.0
    checkpoint_path: ''
    random_init: false
    compile: true # Pytorch 2.0

data:
  max_seq_len: 2048
  max_target_len: 1024
  max_num_instances_per_task: 100
  add_task_name: False
  add_task_definition: True
  num_pos_examples: 2
  num_neg_examples: 0
  add_explanation: False
  tk_instruct: False


optim:

    name: adamwscale # PrecondSchedulePaLMForeachSOAP
    base_lr: 2e-2
    batch_size: 64  # A100 consegue 300 no base. 
    total_steps: 200000
    epochs: -1 # If it's > 0 it overwrites total_steps
    warmup_steps: 10000
    lr_scheduler: cosine
    weight_decay: 0.00
    grad_clip: 1.0
    grad_acc: 1
    final_cosine: 1e-5

eval:
    every_steps: 10000 # Eval once in the end
    steps: 500

checkpoint:
    every_steps: 10000 # Save checkpoint once in the end

logging:
    every_steps: 10
    grad_l2: true
    weights_l2: true
    use_wandb: true
    # Can remove or comment out the below if not using Weights & Biases
    wandb_config:
        project: T5
        entity: 'brataodream'
        tags: ['nanoT5']
        mode: 'online'

hydra:
    job:
        chdir: True
